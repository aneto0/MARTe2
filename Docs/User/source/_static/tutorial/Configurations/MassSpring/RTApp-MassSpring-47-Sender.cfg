$MassSpringApp = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAMTimer = {
            Class = IOGAM
            InputSignals = {
                Counter = {
                    DataSource = Timer
                    Type = uint32
                }
                Time = {
                    Frequency = 1000
                    DataSource = Timer
                    Type = uint32
                }
            }
            OutputSignals = {
                Counter = {
                    DataSource = DDB1
                    Type = uint32
                }                
                Time = {
                    DataSource = DDB1
                    Type = uint32
                }            
            }
        }
        +GAMPerfMonitor = {
            Class = IOGAM            
            InputSignals = {
                Thread1CycleTime = {
                    DataSource = Timings
                    Type = uint32
                    Alias = "State1.Thread1_CycleTime"
                }
                GAMTimer_ReadTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMTimer_ExecTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMTimer_WriteTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMReference_ExecTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMReference_WriteTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMController_ReadTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMController_ExecTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMController_WriteTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMSpringMass_ReadTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMSpringMass_ExecTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMSpringMass_WriteTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMPerfMonitor_ReadTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMPerfMonitor_ExecTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMPerfMonitor_WriteTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMDisplay_ReadTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMDisplay_ExecTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMDisplay_WriteTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMWriterStats_ReadTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMWriterStats_ExecTime = {
                    DataSource = Timings
                    Type = uint32
                }
                GAMWriterStats_WriteTime = {
                    DataSource = Timings
                    Type = uint32
                }
            }
            OutputSignals = {
                Thread1CycleTime = {
                    DataSource = DDB1
                    Type = uint32
                } 
                GAMTimer_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMTimer_ExecTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMTimer_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMReference_ExecTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMReference_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMController_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMController_ExecTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMController_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMSpringMass_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMSpringMass_ExecTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMSpringMass_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMPerfMonitor_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMPerfMonitor_ExecTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMPerfMonitor_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMDisplay_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMDisplay_ExecTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMDisplay_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMWriterStats_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMWriterStats_ExecTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMWriterStats_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
            }
        }
        +GAMMathExpr = {
            Class = MathExpressionGAM
            Expression = "GAMsExecutionTime = GAMDisplay_WriteTime - GAMTimer_ReadTime;"
            InputSignals = {
                GAMTimer_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                GAMDisplay_WriteTime = {
                    DataSource = DDB1
                    Type = uint32
                }
            }
            OutputSignals = {
                GAMsExecutionTime = {
                    DataSource = DDB1
                    Type = uint32
                }
            }
        }
        +GAMReferenceWaveform = {
            Class = WaveformGAM::WaveformPointsDef
            Times =  {0.00 5.00 10.00} 
            Points = {0.00 2.00  0.00}
            InputSignals = {
                Time = {
                    DataSource = DDB1
                    Type = uint32
                }
            }
            OutputSignals = {
                ReferencePosition = {
                    DataSource = DDB1
                    Type = float64
                    Default = 2.0
                }
            }
        }
        +GAMStats = {
            Class = StatisticsGAM
            WindowSize = 32
            InfiniteMaxMin = 0
            InputSignals = {
                Thread1CycleTime = {
                    DataSource = DDB1
                    Type = uint32
                }
            }
            OutputSignals = {
                Thread1CycleTimeAverage = {
                    DataSource = DDB1
                    Type = uint32
                }
                Thread1CycleTimeStdDev = {
                    DataSource = DDB1
                    Type = uint32
                }
                Thread1CycleTimeMin = {
                    DataSource = DDB1
                    Type = uint32
                }
                Thread1CycleTimeMax = {
                    DataSource = DDB1
                    Type = uint32
                }
            }
        }
        +GAMHist = {
            Class = HistogramGAM 
            BeginCycleNumber = 200
            InputSignals = {
                Thread1CycleTime = {
                    DataSource = DDB1
                    Type = uint32
                    MinLim = 7750
                    MaxLim = 12250
                }
                GAMTimer_ReadTime = {
                    DataSource = DDB1
                    Type = uint32
                    MinLim = 2600 
                    MaxLim = 9800
                }
            }
            OutputSignals = {
                Thread1CycleTimeHistogram = {
                    DataSource = DDB1
                    Type = uint32
                    NumberOfElements = 11
                }
                Thread1FreeTimeHistogram = {
                    DataSource = DDB1
                    Type = uint32
                    NumberOfElements = 11
                }
            }
        }
        +GAMMathTriggerSecond = {
            Class = MathExpressionGAM
            Expression = "
                TriggerEveryMicroSecs = (uint32)1000000;
                TruncatedTime = (Time / TriggerEveryMicroSecs) * TriggerEveryMicroSecs;
                TriggerDisplay = (uint8)(Time == TruncatedTime);"
            InputSignals = {
                Time = {
                    DataSource = DDB1
                    Type = uint32
                }
            }
            OutputSignals = {
                TruncatedTime = {
                    DataSource = DDB1
                    Type = uint32
                }
                TriggerDisplay = {
                    DataSource = DDB1
                    Type = uint8
                }
            }
        }
        +GAMDisplay = {
            Class = TriggeredIOGAM
            InputSignals = {
                TriggerDisplay = {
                    DataSource = DDB1
                    Type = uint8
                }
                Time = {
                    DataSource = DDB1
                    Type = uint32
                }
            } 
            OutputSignals = {
                Time = {
                    DataSource = Display
                    Type = uint32
                }
            }
        }
        +GAMWriterRefPos = {
            Class = IOGAM
            InputSignals = {
                Counter = {
                    DataSource = DDB1
                    Type = uint32
                }
                Time = {
                    DataSource = DDB1
                    Type = uint32
                }
                ReferencePosition = {
                    DataSource = DDB1
                    Type = float64
                }
            } 
            OutputSignals = {
                Counter = {
                    DataSource = UDPWriterReference
                    Type = uint32
                }
                Time = {
                    DataSource = UDPWriterReference
                    Type = uint32
                }
                ReferencePosition = {
                    DataSource = UDPWriterReference
                    Type = float64
                }
            }
        }
    }
    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        +DDB1 = {
            Class = GAMDataSource
       	}        
        +Display = {
            Class = LoggerDataSource
        }
        +Timings = {
            Class = TimingDataSource
        }
        +UDPWriterReference = {
            Class = UDP::UDPSender
            Address = "127.0.0.1"
            Port = TUTORIAL_UDP_PORT_1
            ExecutionMode = RealTimeThread 
            Signals = {
                Counter = {
                    Type = uint32
                }
                Time = {
                    Type = uint32
                }
                ReferencePosition = {
                    Type = float64
                }
            }
        }
        +Timer = {
            Class = LinuxTimer
            SleepNature = "Default"
            Signals = {
                Counter = {
                    Type = uint32
                }
                Time = {
                    Type = uint32
                }
            }
        }        
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 0x1
                    Functions = {GAMPerfMonitor GAMTimer GAMReferenceWaveform GAMHist GAMStats GAMMathExpr GAMMathTriggerSecond GAMWriterRefPos GAMDisplay}
                }
            }
        }        
    }
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
}

