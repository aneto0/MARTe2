        }
        PositionM = {
            Type = float64
        }
        Velocity = {
            Type = float64
        }
        VelocityM = {
            Type = float64
        }
        PositionErr = {
            Type = float64
        }
        Force = {
            Type = float64
        }
        ForceAverage = {
            Type = float64
        }
        ForceStdDev = {
            Type = float64
        }
        ForceMax = {
            Type = float64
        }
        ForceMin = {
