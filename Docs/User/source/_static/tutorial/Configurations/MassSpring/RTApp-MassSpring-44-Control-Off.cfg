        ReferencePosition = {
            Type = float64
        }
        SwitchOn = {
            Type = uint32
        }
    }
}
$MassSpringApp = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAMTimer = {
            Class = IOGAM
            InputSignals = {
                Counter = {
                    DataSource = Timer
                    Type = uint32
                }
                Time = {
                    Frequency = 100
                    DataSource = Timer
                    Type = uint32
                }
            }
            OutputSignals = {
                Counter = {
                    DataSource = DDB1
                    Type = uint32
                }                
                Time = {
                    DataSource = DDB1
                    Type = uint32
                }            
            }
        }
        +GAMReference = {
            Class = ConstantGAM
            OutputSignals = {
                ReferencePosition = {
                    DataSource = DDB1
                    Type = float64
                    Default = 2.0
                }
                SwitchOn = {
                    DataSource = DDB1
                    Type = uint32
                    Default = 0
                }
            }
        }
        +GAMWriter = {
            Class = IOGAM
            InputSignals = {
                ReferencePosition = {
                    DataSource = DDB1
                    Type = float64
                }
                SwitchOn = {
                    DataSource = DDB1
                    Type = uint32
                }
            } 
            OutputSignals = {
                ControlIn = {
                    DataSource = OPCUAWriter
                    Type = ControlInput
                    Trigger = 1
                    TriggerSignal = "ControlIn.ReferencePosition"
                }
            }
        }
    }
    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        +DDB1 = {
            Class = GAMDataSource
       	}        
        +Display = {
            Class = LoggerDataSource
        }
        +Timings = {
            Class = TimingDataSource
        }
        +OPCUAWriter = {
            Class = OPCUADataSource::OPCUADSOutput
            Address = OPCUA_FULL_URL
            Authentication = None
            Signals = {
                ControlIn = {
                    NamespaceIndex = 1
                    Type = ControlInput
                    Path = "MassSpringDemoControlInput"
                }
            }
        }
        +Timer = {
            Class = LinuxTimer
            SleepNature = "Default"
            Signals = {
                Counter = {
                    Type = uint32
                }
                Time = {
                    Type = uint32
                }
            }
        }        
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 0x1
                    Functions = {GAMTimer GAMReference GAMWriter}
                }
            }
        }        
    }
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
}

