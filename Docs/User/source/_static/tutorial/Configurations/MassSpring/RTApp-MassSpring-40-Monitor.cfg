#define STR(x) #x
#define XSTR(x) STR(x)

+MassSpringTypes = {
    Class = ReferenceContainer
    +ControlParameters = {
        Class = IntrospectionStructure
        ReferencePosition = {
            Type = float64
        }
        Position = {
            Type = float64
        }
        PositionDisturbed = {
            Type = float64
        }
        PositionFiltered = {
            Type = float64
        }
        PositionM = {
            Type = float64
        }
        Velocity = {
            Type = float64
        }
        VelocityM = {
            Type = float64
        }
        PositionErr = {
            Type = float64
        }
        Force = {
            Type = float64
        }
        ForceAverage = {
            Type = float64
        }
        ForceStdDev = {
            Type = float64
        }
        ForceMax = {
            Type = float64
        }
        ForceMin = {
            Type = float64
        }
    }
    +GAMPerformance = {
        Class = IntrospectionStructure
        ReadTime = {
            Type = uint32
        }
        ExecTime = {
            Type = uint32
        }
        WriteTime = {
            Type = uint32
        }
    }
    +ThreadPerformance = {
        Class = IntrospectionStructure
        CycleTime = {
            Type = uint32
        }
        CycleTimeAverage = {
            Type = uint32
        }
        CycleTimeMovingAverage = {
            Type = float32
        }
        CycleTimeStdDev = {
            Type = uint32
        }
        CycleTimeMax = {
            Type = uint32
        }
        CycleTimeMin = {
            Type = uint32
        }
        CycleTimeHistogram = {
            Type = uint32
            NumberOfElements = 11
        }
        FreeTimeHistogram = {
            Type = uint32
            NumberOfElements = 11
        }
        GAMsExecutionTime = {
            Type = uint32
        }
    }
    +AppPerformance = {
        Class = IntrospectionStructure
        GAMTimer = {
            Type = GAMPerformance
        }
        GAMReference = {
            Type = GAMPerformance
        }
        GAMController = {
            Type = GAMPerformance
        }
        GAMSpringMass = {
            Type = GAMPerformance
        }
        GAMPerfMonitor = {
            Type = GAMPerformance
        }
        GAMDisplay = {
            Type = GAMPerformance
        }
        Thread1 = {
            Type = ThreadPerformance
        } 
    }
    +MonitorControl = {
        Class = IntrospectionStructure
        Time = {
            Type = uint32
        }
        Control = {
            Type = ControlParameters
        }
    }
}
$MassSpringAppMonitor = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAMTimer = {
            Class = IOGAM
            InputSignals = {
                Counter = {
                    DataSource = Timer
                    Type = uint32
                }
                Time = {
                    Frequency = 10
                    DataSource = Timer
                    Type = uint32
                }
            }
            OutputSignals = {
                Counter = {
                    DataSource = DDB1
                    Type = uint32
                }                
                Time = {
                    DataSource = DDB1
                    Type = uint32
                }            
            }
        }
        +GAMReader = {
            Class = IOGAM
            InputSignals = {
                Monitor = {
                    DataSource = OPCUAReader
                    Type = MonitorControl
                }
            }
            OutputSignals = {
                Monitor = {
                    DataSource = DDB1
                    Type = MonitorControl
                }
            }
        }
        +GAMDisplay = {
            Class = IOGAM
            InputSignals = {
                Monitor = {
                    DataSource = DDB1
                    Type = MonitorControl
                }
            } 
            OutputSignals = {
                Monitor = {
                    DataSource = Display
                    Type = MonitorControl
                }
            }
        }
    }
    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        +DDB1 = {
            Class = GAMDataSource
       	}        
        +Display = {
            Class = LoggerDataSource
        }
        +Timings = {
            Class = TimingDataSource
        }
        +OPCUAReader = {
            Class = OPCUADataSource::OPCUADSInput
            NumberOfBuffers = 2
            CPUMask = 0x1 
            StackSize = 10000000 
            Address = OPCUA_FULL_URL
            Authentication = None
            Signals = {
                Monitor = {
                    NamespaceIndex = 1
                    Type = MonitorControl 
                    Path = "MassSpringDemo"
                }
            }
        }
        +Timer = {
            Class = LinuxTimer
            SleepNature = "Default"
            Signals = {
                Counter = {
                    Type = uint32
                }
                Time = {
                    Type = uint32
                }
            }
        }        
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 0x1
                    Functions = {GAMTimer GAMReader GAMDisplay}
                }
            }
        }        
    }
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
}

